[package]
name = "harbagsa"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = "0.20"
bevy_rapier3d = { version = "0.37", features = ["debug-render-3d"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unwrap_or_default = "deny"
get_unwrap = "deny"
map_unwrap_or = "deny"
unnecessary_unwrap = "deny"
mem_forget = "deny"
only_used_in_recursion = "deny"
allow_attributes = "deny"
clone_on_ref_ptr = "deny"
mutex_atomic = "deny"
rc_mutex = "deny"

# Bevy recommends optimized dependencies so the engine runs fast in debug builds.
# The extra debug info also makes full rebuilds slower, so keep it line-only.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
